name: Finalize pretty workflow JSON

on:
  push:
    branches: [main]
    paths:
      - '.workflow_payload/**'
      - '.github/workflows/format-workflows.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and validate pretty workflow JSON files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          specs = [
              (
                  Path('.workflow_payload/single.json.gz.b64'),
                  Path('workflows/viggle-animate-h3-single-latent-upscale-switch.json'),
                  '3388194141d91e3ddb3283dffb5119e05fe9a4802f0405958b1a340d4d2e37b4',
              ),
              (
                  Path('.workflow_payload/chunk.json.gz.b64'),
                  Path('workflows/viggle-animate-h3-chunked-latent-upscale-refine.json'),
                  '6cd9f2e4b5f2bf5bbcc5ca47d870dfe0762f1654c4aaba99af3f88fd66ed5f41',
              ),
          ]

          for src, dst, expected_sha in specs:
              packed = base64.b64decode(src.read_text(encoding='ascii').strip())
              raw = gzip.decompress(packed)
              actual_sha = hashlib.sha256(raw).hexdigest()
              if actual_sha != expected_sha:
                  raise RuntimeError(f'SHA256 mismatch for {src}: {actual_sha}')

              # Validate JSON and normalize to stable, human-readable formatting.
              obj = json.loads(raw.decode('utf-8'))
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_text(
                  json.dumps(obj, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              print(f'Wrote {dst} ({len(raw)} source bytes, sha256={actual_sha})')
          PY

          rm -rf .workflow_parts .workflow_payload
          rm -f .github/workflows/format-workflows.yml

      - name: Commit final workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pretty-format final workflow JSON files"
          git push
